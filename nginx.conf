server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ----- Performance -----
    gzip               on;
    gzip_vary          on;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ----- Security headers -----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # ----- Long-lived caching for hashed build assets -----
    location /_astro/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ----- Images & fonts -----
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # ----- Routing: serve Astro "directory" output without trailing-slash
    #       301 redirects, and return a real 404 for unknown paths. -----
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # ----- Custom 404 page -----
    error_page 404 /404.html;
}
